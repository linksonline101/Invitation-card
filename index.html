<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit & Shikha - Wedding Invitation</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Tiro+Devanagari+Hindi&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: '#780000',
                        deepred: '#900000',
                        gold: '#C5A059',
                        lightgold: '#E3C788',
                        ivory: '#FAF7EE',
                    },
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'cursive': ['"Great Vibes"', 'cursive'],
                        'hindi': ['"Tiro Devanagari Hindi"', 'serif'],
                        'cinzel': ['"Cinzel"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            background-color: #FAF7EE;
            color: #780000;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Full Screen Section Containers */
        .invite-section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Parallax Wrapper for Exit Animation */
        .parallax-wrapper {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            will-change: transform, opacity;
            padding: 2rem 1rem;
        }

        /* Background Pattern (Subtle Mandala) */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.627 0l.83.83-54.627 54.627-.83-.83L54.627 0zM0 54.627l.83.83L60 1.66 59.17.83 0 54.627z' fill='%23C5A059' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
        }

        /* Base Animation Element Styles (ENTRY) */
        .anim-elem {
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s ease-out;
            will-change: transform, opacity;
            width: 100%;
            max-width: 800px;
            text-align: center;
            opacity: 0; /* Hidden by default */
        }

        .hidden-left { transform: translateX(-80px); }
        .hidden-right { transform: translateX(80px); }
        
        .is-visible {
            transform: translate(0, 0);
            opacity: 1;
        }

        /* Delays */
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }

        /* Utility Elements */
        .dotted-line {
            border-bottom: 2px dotted #C5A059;
            flex-grow: 1;
            margin: 0 15px;
            position: relative;
            top: -6px;
        }

        /* Section 3 Red Background & Border */
        .bg-ritual {
            background-color: #8B0000;
            background-image: radial-gradient(#900000 10%, #600000 90%);
            color: #FAF7EE;
        }
        .border-ritual {
            border: 12px solid transparent;
            border-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='6' fill='none' stroke='%23FAF7EE' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23FAF7EE'/%3E%3C/svg%3E") 30 stretch;
            padding: 2rem;
            border-radius: 8px;
        }

        /* SVG Overlays */
        .arch-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .flora-fauna-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Swipe / Scroll Up Indicator Animations */
        @keyframes swipeUpMotion {
            0%, 100% { transform: translateY(4px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes chevronWave {
            0% { opacity: 0.2; transform: translateY(4px); }
            50% { opacity: 1; transform: translateY(-2px); }
            100% { opacity: 0.2; transform: translateY(-6px); }
        }

        .swipe-float {
            animation: swipeUpMotion 1.8s ease-in-out infinite;
        }

        .chevron-1 { animation: chevronWave 1.6s infinite 0.3s; }
        .chevron-2 { animation: chevronWave 1.6s infinite 0s; }

        /* Floating Scroll Cue for Slides 2 to 5 */
        #floating-scroll-cue {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #floating-scroll-cue.show-cue {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
